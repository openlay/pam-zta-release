# pam-zta Gateway Control — configuration
#
# Install to /etc/pam-zta/gateway.toml (mode 0600, owned by root).
# Systemd unit only needs:  ExecStart=/opt/pam-zta/bin/gateway -config /etc/pam-zta/gateway.toml

[server]
# HTTP listen address. Ignored when autocert_domain is set (autocert always binds :80 + :443).
listen_addr = ":8443"

# Manual TLS (leave empty to use plain HTTP or autocert below).
tls_cert = ""
tls_key  = ""

# Let's Encrypt autocert. Domain must point to this server before starting.
# Listens on :80 (HTTP-01 challenge) and :443 (HTTPS/WSS).
autocert_domain    = ""
autocert_cache_dir = "/var/lib/pam-zta/autocert-cache"
autocert_email     = ""

[ca]
# Shared bearer token that the CA Service must present on the /v1/ca/ws WebSocket.
# Generate with:  openssl rand -hex 32
# The CA token is only a transport-layer secret — the actual security of the
# system comes from the per-request approval-chain signatures verified by the
# CA against its AdminKeyStore.
token = ""

[ledger]
db_path = "/var/lib/pam-zta/gateway_ledger.db"

[cert]
# Issued SSH user certificate lifetime (seconds).
ttl = 300

# NOTE: The gateway holds NO role-granting signing key.
# All roles (root, super_admin, admin, user_device) are held by iOS signers
# (Secure Enclave P-256 or Ed25519). Root trust is established by importing
# a root identity cert into the CA Service trust store — see
# ca-service/root_certs/ for details.
#
# The [gateway_key] section below configures a SEPARATE identity key used
# only to sign outbound data for audit non-repudiation — it grants no
# privileges. Downstream components (CA, signer, OSH, SIEM) verify it to
# attest which gateway processed each payload.

[gateway_key]
# File backend path. Auto-generated on first start with 0600 perms.
# Ignored when TPM 2.0 is available (and tpm_disabled = false).
key_path = "/var/lib/pam-zta/gateway_key.pem"

# Force file backend even when TPM is available. Useful on dev machines.
tpm_disabled = false

# Refuse to start if TPM is unavailable. Use in production where the
# operator has committed to TPM-backed gateway identity.
tpm_required = false

[apns]
# Apple Push Notification service. All four fields must be set to enable
# approval-request push notifications to iOS devices running AppSigner.
# Get team_id + key_id from https://developer.apple.com/account
# key_path is the .p8 file downloaded from the APNs Auth Keys page.
# topic is the iOS bundle ID.
team_id     = ""
key_id      = ""
key_path    = ""
topic       = "com.example.appsigner"
use_sandbox = false   # true for TestFlight / development builds

[freeze]
soft_timeout = "30s"
hard_timeout = "120s"
